[project]
name = "unidev-archive"
version = "0.1.0"
description = "Restauração local e pesquisável do fórum histórico da UniDev"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["lxml>=6.1.1,<7"]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.0"]

[project.scripts]
unidev-archive = "unidev_archive.cli:main"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
reportMissingImports = false

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]
