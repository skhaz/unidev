name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Instalar Python e dependências
        run: uv sync --locked --dev

      - name: Validar código e acervo
        run: |
          uv run ruff check .
          uv run pytest

      - name: Baixar e verificar acervo integral
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .build/acervo
          gh release download archive-data-v4 \
            --pattern 'unidev-archive-*-v4.tar.gz' --dir .build
          printf '%s  %s\n' \
            efed9d453e4c2a66ebbc68ff14e09b0aee13a677f57a882384986a4f1a8147ea .build/unidev-archive-core-v4.tar.gz \
            ffc81e45066c29bffb2a1b171ce5b3fed1cf8976b5f9d741a17fb80b26ec844d .build/unidev-archive-resources-v4.tar.gz | sha256sum -c -
          tar -xzf .build/unidev-archive-core-v4.tar.gz -C .build/acervo
          tar -xzf .build/unidev-archive-resources-v4.tar.gz -C .build/acervo

      - name: Gerar site estático em UTF-8
        run: uv run unidev-archive rebuild --manifest .build/acervo/captures.jsonl --database .build/archive.sqlite3 --output dist

      - name: Construir índice de busca estático
        run: npx --yes pagefind@1.5.2 --site dist --force-language pt

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5.0.0
