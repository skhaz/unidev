name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Instalar Python e dependências
        run: uv sync --locked --dev

      - name: Validar código e acervo
        run: |
          uv run ruff check .
          uv run pytest

      - name: Gerar site estático em UTF-8
        run: uv run unidev-archive rebuild --manifest archive/captures.jsonl --database .build/archive.sqlite3 --output dist

      - name: Construir índice de busca estático
        run: npx --yes pagefind@1.5.2 --site dist --force-language pt

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5.0.0
