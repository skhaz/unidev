name: Publicar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7.0.1

      - name: Instalar uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Instalar Python e dependências
        run: uv sync --locked --dev

      - name: Validar código e acervo
        run: |
          uv run ruff check .
          uv run pytest

      - name: Baixar e verificar acervo integral
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .build/acervo
          gh release download archive-data-v8 \
            --pattern 'unidev-archive-*-v8.tar.gz' --dir .build
          printf '%s  %s\n' \
            4fa88acdbe2ffabdc046fa8928dd78a33575141ee4f887b200dd951356494ae6 .build/unidev-archive-core-v8.tar.gz \
            9aaa808bb0b701ab6812249044c606d3ff67e63e256ae6cd21cc3954c229e37d .build/unidev-archive-resources-v8.tar.gz | sha256sum -c -
          tar -xzf .build/unidev-archive-core-v8.tar.gz -C .build/acervo
          tar -xzf .build/unidev-archive-resources-v8.tar.gz -C .build/acervo

      - name: Gerar site estático em UTF-8
        run: uv run unidev-archive rebuild --manifest .build/acervo/captures.jsonl --database .build/archive.sqlite3 --output dist

      - name: Construir índice de busca estático
        run: npx --yes pagefind@1.5.2 --site dist --force-language pt

      - name: Validar artefato final
        run: |
          uv run python -c 'from pathlib import Path; from unidev_archive.mirror import _validate_output; _validate_output(Path("dist"))'
          test -z "$(find dist \( -type l -o \( -type f -links +1 \) \) -print -quit)"
          test "$(du -sb dist | cut -f1)" -lt 10000000000

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5.0.0
